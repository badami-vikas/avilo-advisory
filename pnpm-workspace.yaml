packages:
  - "platform/apps/*"
  - "platform/modules/*"
  - "platform/packages/*"

# Build scripts are opt-in under pnpm 11. esbuild backs vite/vitest; better-sqlite3
# compiles the embedded SQLite engine.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  # electron's install script downloads the platform runtime; without it the package is
  # metadata and nothing can be launched or packaged.
  electron: true
